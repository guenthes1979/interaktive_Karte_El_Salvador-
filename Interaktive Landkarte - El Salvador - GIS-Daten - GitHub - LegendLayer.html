<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Salvador – Karte</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }
	
	/* Falls irgendein CSS Leaflet Controls versteckt */
	.leaflet-top, .leaflet-bottom { z-index: 999999 !important; }
	.leaflet-control { display: block !important; }
	
	
	.photo-marker {
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    display:block;
  }
	
	.river-label{
  font-size:10px;
  font-weight:700;
  color:#2b6cb0; /* blau */
  text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  white-space:nowrap;
  pointer-events:none;
}
.river-label.main{
  font-size:12px;
  color:#1f6feb; /* kräftigeres Blau für Lempa */
}

  .popup-img {
    width:220px;
    max-width:100%;
    border-radius:10px;
    margin-top:8px;
    display:block;
  }
}


  </style>
</head>

<body>
  <!-- WICHTIG: Muss VOR dem Script stehen -->
  <div id="map"></div>

 <script>
  const map = L.map("map");
  map.fitBounds([[13.0, -90.2], [14.5, -87.6]]);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap",
    maxZoom: 19
  }).addTo(map);

  // ================= LAYER =================
  const layerStaedte = L.layerGroup().addTo(map);
  const layerKultur = L.layerGroup().addTo(map);
  const layerNatur = L.layerGroup().addTo(map);
  const layerStrand = L.layerGroup().addTo(map);
  const layerBesondereOrte = L.layerGroup().addTo(map);
  const layerFluesse = L.layerGroup().addTo(map);
  

    // ================= LAYER CONTROL =================
  L.control.layers(null, {
  "🏙️ Städte": layerStaedte,
  "🏛️ Sehenswürdigkeiten": layerKultur,
  "🌿 Natur": layerNatur,
  "🏖️ Strand": layerStrand,
  "🟦 Flüsse": layerFluesse
}, { collapsed: false }).addTo(map);
  
  
  // ================= LEGENDE =================
    const legend = L.control({ position: "topright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div");
      div.style.background = "white";
      div.style.padding = "10px";
      div.style.borderRadius = "10px";
      div.style.boxShadow = "0 2px 8px rgba(0,0,0,.2)";
      div.style.fontSize = "13px";
      div.style.lineHeight = "1.35";
      div.style.maxWidth = "220px";
      div.style.zIndex = "99999";
      div.innerHTML = `
        <b>Legende</b><br>
        🏙️ Städte<br>
        🏛️ Sehenswürdigkeiten<br>
        🌿 Natur / Parks / Vulkane<br>
        🏖️ Strände<br>
        ❗ Besondere Orte<br>
        <hr style="border:none;border-top:1px solid #eee;margin:8px 0;">
        <span style="border-top:3px solid #1f6feb;display:inline-block;width:30px"></span> Hauptfluss<br>
        <span style="border-top:2px solid #6ea8ff;display:inline-block;width:30px"></span> Weitere Flüsse
      `;
      return div;
    };
    legend.addTo(map);

	// ✅ erzwinge Sichtbarkeit (falls CSS sie versteckt)
	const c = legend.getContainer();
	c.style.display = "block";
	c.style.zIndex = "999999";

 </script>

</body>
</html>
