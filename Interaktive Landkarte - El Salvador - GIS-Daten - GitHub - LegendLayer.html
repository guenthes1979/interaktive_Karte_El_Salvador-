<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Salvador – Karte</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }
	
	/* Falls irgendein CSS Leaflet Controls versteckt */
	.leaflet-top, .leaflet-bottom { z-index: 999999 !important; }
	.leaflet-control { display: block !important; }
	
	
	.photo-marker {
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    display:block;
  }
	
	.river-label{
  font-size:10px;
  font-weight:700;
  color:#2b6cb0; /* blau */
  text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  white-space:nowrap;
  pointer-events:none;
}
.river-label.main{
  font-size:12px;
  color:#1f6feb; /* kräftigeres Blau für Lempa */
}

  .popup-img {
    width:220px;
    max-width:100%;
    border-radius:10px;
    margin-top:8px;
    display:block;
  }
}


  </style>
</head>

<body>
  <!-- WICHTIG: Muss VOR dem Script stehen -->
  <div id="map"></div>

 <script>
  alert("✅ Script läuft!");

  const map = L.map("map");
  map.fitBounds([[13.0, -90.2], [14.5, -87.6]]);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap",
    maxZoom: 19
  }).addTo(map);

  alert("✅ Karte + TileLayer OK");

  // Layer anlegen
  const layerStaedte = L.layerGroup().addTo(map);
  const layerKultur = L.layerGroup().addTo(map);

  alert("✅ Layer OK");

  // Layer-Control
  L.control.layers(null, {
    "🏙️ Städte": layerStaedte,
    "🏛️ Sehenswürdigkeiten": layerKultur
  }, { collapsed: false }).addTo(map);

  alert("✅ Layer-Control OK");
</script>

</body>
</html>
